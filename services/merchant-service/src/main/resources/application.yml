server:
  port: 8084

spring:
  application:
    name: merchant-service

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?options=-c%20TimeZone=UTC
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

payflow:
  qr:
    secret: ${QR_HMAC_SECRET}
    ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info